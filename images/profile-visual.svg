<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900" role="img" aria-labelledby="title desc">
<title id="title">Abstract professional profile visual</title>
<desc id="desc">A modern abstract illustration featuring the initials YD and finance and technology motifs.</desc>
<defs>
