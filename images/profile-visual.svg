  </linearGradient>
  <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#16223d"/>
    <stop offset="1" stop-color="#25355a"/>
  </linearGradient>
</defs>
<rect width="800" height="900" rx="64" fill="url(#g2)"/>
<circle cx="640" cy="150" r="110" fill="#58d6c7" opacity=".12"/>
<circle cx="120" cy="740" r="150" fill="#8fb4ff" opacity=".10"/>
